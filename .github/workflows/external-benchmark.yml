name: External invoice benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "evaluation/fetch_public_invoice_test.py"
      - "evaluation/real_world_eval.py"
      - ".github/workflows/external-benchmark.yml"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-lite.txt
      - run: python evaluation/fetch_public_invoice_test.py
      - run: python evaluation/real_world_eval.py --dataset evaluation/external_invoices --output evaluation/results/external_invoices.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-invoice-benchmark
          path: evaluation/results/external_invoices.json
