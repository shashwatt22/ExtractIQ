name: Docker Compose smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/app/api/documents.py"
      - "backend/app/pipeline/hybrid.py"
      - "frontend/streamlit_app.py"
      - "docker-compose.yml"
      - ".github/workflows/docker-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Verify API and UI
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:8501/_stcore/health >/dev/null && curl -fsS http://localhost:8000/openapi.json | python -c 'import json,sys; assert "/api/documents/batch" in json.load(sys.stdin)["paths"]'; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=80
          exit 1
      - if: always()
        run: docker compose down -v --remove-orphans
