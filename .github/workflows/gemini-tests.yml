name: Gemini feature tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gemini-offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install -r requirements-lite.txt
      - name: Lint changed extraction and API code
        run: |
          python -m pip install ruff
          ruff check --select E4,E7,E9,F63,F7,F82 frontend/gemini_features.py backend/app/pipeline/extractors/invoice_ranking.py backend/app/api/documents.py backend/app/rag/qa.py backend/app/security/pii.py evaluation/real_world_eval.py
      - name: Test Gemini feature without API calls
        run: python -m pytest tests/test_gemini_features.py tests/test_real_world_eval.py tests/test_invoice_ranking.py tests/test_rag_privacy.py -q
